name: Terraform

on:
  push:
    branches:
      - "**"

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: parent_module

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "7ff64f4f-b262-45cf-9d0d-12ada29b21fb" \
            --password "2Q98Q~z1ylAj2dmUbbjZXfk3OR0hAkQCl-mPtbFm" \
            --tenant "5567a211-c5c0-42ff-990b-03aa0d9c9a50"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "9df97a69-4386-4a40-baae-b62764f0c5f1"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan

  terraform-apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    needs: terraform-plan

    # Apply ONLY after push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: parent_module

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        run: |
          az login \
            --service-principal \
            --username "7ff64f4f-b262-45cf-9d0d-12ada29b21fb" \
            --password "2Q98Q~z1ylAj2dmUbbjZXfk3OR0hAkQCl-mPtbFm" \
            --tenant "5567a211-c5c0-42ff-990b-03aa0d9c9a50"

      - name: Set Azure Subscription
        run: |
          az account set \
            --subscription "9df97a69-4386-4a40-baae-b62764f0c5f1"

      - name: Check Azure Login
        run: az account show

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan